<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>البحث الصوتي في القرآن</title>

<style>
body {
  font-family: sans-serif;
  padding: 25px;
  background: #f2f2f2;
  line-height: 1.8;
  font-size: 26px;
}

h2 {
  font-size: 34px;
  text-align: center;
  margin-bottom: 30px;
}

button {
  width: 100%;
  padding: 22px;
  font-size: 30px;
  margin-top: 20px;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 14px;
  cursor: pointer;
}

button:active {
  background: #2563eb;
}

#heard {
  margin-top: 30px;
  font-size: 30px;
  color: #444;
}

#result {
  margin-top: 40px;
  font-size: 34px;
  line-height: 2.0;
  background: #ffffff;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

#info {
  margin-top: 10px;
  font-size: 24px;
  text-align: center;
  color: #666;
}
</style>
</head>

<body>

<h2>🎤 البحث الصوتي في القرآن</h2>
<div id="info"></div>
<button id="btn">🎙 اضغط للتسجيل</button>

<div id="heard"></div>
<div id="result"></div>

<script src="quran.js"></script>

<script>
let quran = QURAN;
document.getElementById("info").textContent = "عدد الآيات المحمّلة: " + quran.length;

function N(t){
  return t.replace(/[ًٌٍَُِّْـ]/g,"")
  .replace(/[أإآ]/g,"ا")
  .replace(/ى/g,"ي")
  .replace(/ة/g,"ه")
  .replace(/[^ء-ي ]/g," ")
  .replace(/\s+/g," ")
  .trim();
}

function score_words(v,a){
  v = N(v).split(" ");
  a = N(a).split(" ");
  let s=0;
  for(let w of v){
    for(let x of a){
      let m=0;
      for(let c of w) if(x.includes(c)) m++;
      if(m / Math.max(w.length,1) > 0.6){ s++; break; }
    }
  }
  return s;
}

function score_sequence(v,a){
  v = N(v).split(" ");
  a = N(a).split(" ");
  let best=0;
  for(let i=0;i<a.length;i++){
    let k=0;
    for(let j=0;j<v.length && i+j<a.length;j++){
      if(a[i+j].includes(v[j]) || v[j].includes(a[i+j])) k++;
      else break;
    }
    if(k>best) best=k;
  }
  return best*10;
}

function score_suffix(v,a){
  v=N(v);
  a=N(a);
  let min=Math.min(v.length,a.length);
  let k=0;
  for(let i=1;i<=min;i++){
    if(v[v.length-i]===a[a.length-i]) k++;
    else break;
  }
  return k*15;
}

function score_line(v,a){
  v=N(v);
  a=N(a);
  let m=0;
  for(let c of v) if(a.includes(c)) m++;
  return (m/Math.max(v.length,1))*20;
}

function score(v,a){
  return score_words(v,a)
    + score_sequence(v,a)
    + score_suffix(v,a)
    + score_line(v,a);
}

function findAya(text){
  let best=null, bestScore=-1;
  for(let a of quran){
    let sc = score(text,a.textNoTashkeel);
    if(sc>bestScore){
      bestScore=sc; 
      best=a;
    }
  }
  if(bestScore < 20) return null;
  return best;
}

const btn=document.getElementById("btn");
const heard=document.getElementById("heard");
const result=document.getElementById("result");

btn.onclick=()=>{
  if(!("webkitSpeechRecognition" in window)){
    alert("المتصفح لا يدعم التعرف على الصوت");
    return;
  }
  let r=new webkitSpeechRecognition();
  r.lang="ar-SA";
  r.interimResults=false;

  r.onresult=e=>{
    let text=e.results[0][0].transcript;
    heard.innerHTML="🔊 النص المسموع:<br><b>"+text+"</b>";
    let aya=findAya(text);
    if(aya){
      result.innerHTML=
      "<b>"+aya.surah+" - آية "+aya.aya+"</b><br><br>"+aya.textTashkeel;
    }else{
      result.innerHTML="❌ لم يتم العثور على آية مطابقة";
    }
  };

  r.onerror=()=>alert("خطأ في الصوت");
  r.start();
};
</script>

</body>
</html>
