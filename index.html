<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>البحث الصوتي في القرآن</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: "Naskh";
    src: url("NotoNaskh.ttf") format("truetype");
}

body {
  font-family: "Naskh", serif;
  padding: 25px;
  background: #f2f2f2;
  line-height: 2.2;
  font-size: 30px;
}

h2 {
  font-size: 38px;
  text-align: center;
  margin-bottom: 30px;
}

button {
  width: 100%;
  padding: 22px;
  font-size: 32px;
  margin-top: 20px;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-family: "Naskh";
}

button:active {
  background: #2563eb;
}

#heard {
  margin-top: 30px;
  font-size: 32px;
  color: #444;
  font-family: "Naskh";
}

#result {
  margin-top: 40px;
  font-size: 36px;
  line-height:  1.5;
  background: #ffffff;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.1);
  font-family: "Naskh";
}

.nav-buttons {
  margin-top: 25px;
  display: flex;
  gap: 15px;
}

.nav-buttons button {
  flex: 1;
  font-size: 30px;
  padding: 18px;
  background: #10b981;
}

.nav-buttons button:active {
  background: #059669;
}

#info {
  margin-top: 10px;
  font-size: 26px;
  text-align: center;
  color: #666;
  font-family: "Naskh";
}

</style>
</head>

<body>



<div id="info"></div>
<button id="btn">🎙  للبحث الصوتي في القرآن </button>

<div id="heard"></div>
<div id="result"></div>

<!-- أزرار التنقل -->
<div class="nav-buttons">
  <button id="prev">⬅ الآية السابقة</button>
  <button id="next">➡ الآية التالية</button>
</div>

<script src="quran.js"></script>

<script>
let quran = QURAN;
let currentIndex = -1;

document.getElementById("info").textContent = "عدد ايات القرآن المحمّلة: " + quran.length;

function N(t){
  return t.replace(/[ًٌٍَُِّْـ]/g,"")
  .replace(/[أإآ]/g,"ا")
  .replace(/ى/g,"ي")
  .replace(/ة/g,"ه")
  .replace(/[^ء-ي ]/g," ")
  .replace(/\s+/g," ")
  .trim();
}

function score_words(v,a){
  v = N(v).split(" ");
  a = N(a).split(" ");
  let s=0;
  for(let w of v){
    for(let x of a){
      let m=0;
      for(let c of w) if(x.includes(c)) m++;
      if(m / Math.max(w.length,1) > 0.6){ s++; break; }
    }
  }
  return s;
}

function score_sequence(v,a){
  v = N(v).split(" ");
  a = N(a).split(" ");
  let best=0;
  for(let i=0;i<a.length;i++){
    let k=0;
    for(let j=0;j<v.length && i+j<a.length;j++){
      if(a[i+j].includes(v[j]) || v[j].includes(a[i+j])) k++;
      else break;
    }
    if(k>best) best=k;
  }
  return best*10;
}

function score_suffix(v,a){
  v=N(v);
  a=N(a);
  let min=Math.min(v.length,a.length);
  let k=0;
  for(let i=1;i<=min;i++){
    if(v[v.length-i]===a[a.length-i]) k++;
    else break;
  }
  return k*15;
}

function score_line(v,a){
  v=N(v);
  a=N(a);
  let m=0;
  for(let c of v) if(a.includes(c)) m++;
  return (m/Math.max(v.length,1))*20;
}

function score(v, a) {
  const s1 = score_words(v, a);       // الكلمات المتشابهة
  const s2 = score_sequence(v, a);    // الكلمات المتتابعة
  const s3 = score_suffix(v, a);      // نهاية مشابهة
  const s4 = score_line(v, a);        // تشابه عام للحروف
  const s5 = score_chunks(v, a);      // NEW — مطابقة سلاسل 2–3 كلمات

  return s1 + s2 + s3 + s4 + s5;
}


function findAya(text){
  let query = N(text);

  // 1) مطابقة مقاطع حرفية قوية
  for (let a of quran){
    let clean = N(a.textNoTashkeel);

    if (clean.includes(query) && query.length > 7) {
      currentIndex = a.id - 1;
      return a;
    }
  }

  // 2) إذا لم توجد مطابقة مباشرة → استخدم النظام القديم
  let best=null, bestScore=-1;
  for(let i=0;i<quran.length;i++){
    let a=quran[i];
    let sc = score(text,a.textNoTashkeel);
    if(sc>bestScore){
      bestScore=sc;
      best=a;
      currentIndex = i;
    }
  }

  if(bestScore < 20) return null;
  return best;
}


function showAya(a){
  document.getElementById("result").innerHTML =
    "<b>"+a.surah+" - آية "+a.aya+"</b><br><br>"+a.textTashkeel;
}

document.getElementById("btn").onclick=()=>{
  if(!("webkitSpeechRecognition" in window)){
    alert("المتصفح لا يدعم التعرف على الصوت");
    return;
  }
  let r=new webkitSpeechRecognition();
  r.lang="ar-SA";
  r.interimResults=false;

  r.onresult=e=>{
    let text=e.results[0][0].transcript;
    heard.innerHTML="🔊 النص المسموع:<br><b>"+text+"</b>";
    let aya=findAya(text);
    if(aya) showAya(aya);
    else document.getElementById("result").innerHTML="❌ لم يتم العثور على آية مطابقة";
  };

  r.onerror=()=>alert("خطأ في الصوت");
  r.start();
};

document.getElementById("prev").onclick = ()=>{
  if(currentIndex > 0){
    currentIndex--;
    showAya(quran[currentIndex]);
  }
};

document.getElementById("next").onclick = ()=>{
  if(currentIndex < quran.length-1){
    currentIndex++;
    showAya(quran[currentIndex]);
  }
};
</script>

</body>
</html>
